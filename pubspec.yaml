name: bus_time_saver
description: "This is a bus time tacking app"
publish_to: 'none'

version: 1.1.0+4

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.3
  flutter_native_splash: ^2.4.1
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  connectivity_plus: ^7.3.2
  flutter_dotenv: ^6.0.1
  http: ^1.2.2
  github_release_apk_updater: ^1.0.11
  package_info_plus: ^10.2.2
  sqflite: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/branding.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: assets/logo.png
  branding: assets/branding.png
  branding_dark: assets/branding.png

  android_12:
    image: assets/logo.png
    icon_background_color: "#000000"
    color: "#000000"
    color_dark: "#000000"
    branding: assets/branding.png
    branding_dark: assets/branding.png

